# Local SQS (ElasticMQ) mirroring the Terraform queues: eval-jobs with a dead-letter queue
# after 5 receives, 120 s visibility timeout, 20 s long polling.
include classpath("application.conf")

queues {
  eval-jobs {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "eval-jobs-dlq"
      maxReceiveCount = 5
    }
  }
  eval-jobs-dlq { }
}
