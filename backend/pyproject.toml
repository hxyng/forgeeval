[project]
name = "forgeeval-backend"
version = "0.1.0"
description = "ForgeEval API and evaluation workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36,<2.1",  # opentelemetry-instrumentation-sqlalchemy supports < 2.1
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "redis>=5.2",
  "jsonschema>=4.23",
  "httpx>=0.28",
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.45.1",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1",
  "opentelemetry-instrumentation-fastapi>=0.66b1",
  "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
  "opentelemetry-instrumentation-redis>=0.66b1",
  "opentelemetry-instrumentation-httpx>=0.66b1",
  "boto3>=1.35",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-jsonschema>=4.26.0.20261006",
  "boto3-stubs[s3,sqs]>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forgeeval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.mypy]
strict = true
plugins = []
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
