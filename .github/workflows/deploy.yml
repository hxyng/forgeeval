name: deploy

# Builds the images, migrates the database, rolls the ECS services and smoke-tests the load balancer.
# It does nothing until the repository variable AWS_DEPLOY_ROLE_ARN is set (see
# docs/runbooks/deploy-and-rollback.md). Credentials come from OIDC; there are no AWS secrets.
#
# Two Terraform options change what it does (infra/README.md, "Lean always-on"):
#   cpu_architecture = ARM64   images are built for linux/arm64. The architecture is read from the api
#                              task definition, so it always agrees with what Terraform registered.
#   console_hosting = s3_cloudfront   (repository variable CONSOLE_HOSTING) no web image or service:
#                              the console is built, synced to S3 and CloudFront is invalidated.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a deploy that is mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  NAME_PREFIX: ${{ vars.NAME_PREFIX || 'forgeeval-prod' }}
  IMAGE_SHA: ${{ github.sha }}
  CONSOLE_HOSTING: ${{ vars.CONSOLE_HOSTING || 'ecs' }}

defaults:
  run:
    shell: bash

jobs:
  deploy:
    # Skipped (not failed) when no AWS account is connected. The variable must exist at repository
    # level: environment variables are not visible to a job-level condition.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Demo mode (infra/README.md): while the environment sleeps there are no ECS services, so there
      # is nothing to migrate or roll. Skip instead of failing; the wake-up recreates the services
      # from the last deployed revision, which still matches the database schema. Deploy again after waking.
      - name: Check that the environment is awake
        id: awake
        run: |
          set -euo pipefail
          count=$(aws ecs describe-services --cluster "$NAME_PREFIX" --services "${NAME_PREFIX}-api" \
            --query "length(services[?status=='ACTIVE'])" --output text)
          if [ "$count" = "0" ]; then
            echo "::notice::The environment is asleep (no api service). Skipping the deploy; wake it with infra/scripts/demo.sh up, then run this workflow again."
            echo "awake=false" >> "$GITHUB_OUTPUT"
          else
            echo "awake=true" >> "$GITHUB_OUTPUT"
          fi

      # The task definitions are the source of truth for the CPU architecture. An ARM64 image gets its
      # own tag suffix: tags are immutable, so a re-run after switching architecture must not reuse the
      # other architecture's image.
      - name: Read the CPU architecture from the task definition
        id: arch
        if: steps.awake.outputs.awake == 'true'
        run: |
          set -euo pipefail
          arch=$(aws ecs describe-task-definition --task-definition "${NAME_PREFIX}-api" \
            --query 'taskDefinition.runtimePlatform.cpuArchitecture' --output text)
          case "$arch" in
            ARM64) platform=linux/arm64; suffix=-arm64 ;;
            X86_64|None) platform=linux/amd64; suffix= ;;
            *) echo "::error::Unexpected cpuArchitecture '$arch' in ${NAME_PREFIX}-api"; exit 1 ;;
          esac
          echo "Building for ${platform} (task definition architecture: ${arch})"
          {
            echo "platform=${platform}"
            echo "tag=${IMAGE_SHA}${suffix}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (cross-building for arm64 on an x86 runner)
        if: steps.awake.outputs.awake == 'true' && steps.arch.outputs.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3
        if: steps.awake.outputs.awake == 'true'

      - name: Log in to ECR
        id: ecr
        if: steps.awake.outputs.awake == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        if: steps.awake.outputs.awake == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          PLATFORM: ${{ steps.arch.outputs.platform }}
          IMAGE_TAG: ${{ steps.arch.outputs.tag }}
        run: |
          set -euo pipefail
          images=(backend)
          # The console is static files on S3 and CloudFront in that mode: no web image.
          if [ "$CONSOLE_HOSTING" = "ecs" ]; then images+=(web); fi
          for image in "${images[@]}"; do
            repository="${NAME_PREFIX}-${image}"
            # Tags are immutable: a re-run of the same commit reuses the image already pushed.
            existing=$(aws ecr batch-get-image --repository-name "$repository" \
              --image-ids "imageTag=${IMAGE_TAG}" --query 'images[0].imageId.imageTag' --output text)
            if [ "$existing" = "$IMAGE_TAG" ]; then
              echo "$repository:$IMAGE_TAG already exists, skipping build"
              continue
            fi
            docker buildx build --platform "$PLATFORM" --provenance=false --push \
              --tag "${REGISTRY}/${repository}:${IMAGE_TAG}" "$image"
          done

      - name: Register task definitions with the new images
        if: steps.awake.outputs.awake == 'true'
        id: taskdefs
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.arch.outputs.tag }}
        run: |
          set -euo pipefail
          backend="${REGISTRY}/${NAME_PREFIX}-backend:${IMAGE_TAG}"
          web="${REGISTRY}/${NAME_PREFIX}-web:${IMAGE_TAG}"

          # Copy the latest revision of a family, swap the image of one container (the ADOT sidecar
          # keeps its own image) and register it as a new revision.
          register() {
            local family=$1 container=$2 image=$3
            aws ecs describe-task-definition --task-definition "$family" --query taskDefinition --output json \
              | jq --arg c "$container" --arg i "$image" '
                  del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy, .deregisteredAt)
                  | (.containerDefinitions[] | select(.name == $c) | .image) = $i' > "${family}.json"
            aws ecs register-task-definition --cli-input-json "file://${family}.json" \
              --query taskDefinition.taskDefinitionArn --output text
          }

          {
            echo "migrate=$(register "${NAME_PREFIX}-migrate" migrate "$backend")"
            echo "api=$(register "${NAME_PREFIX}-api" api "$backend")"
            echo "worker=$(register "${NAME_PREFIX}-worker" worker "$backend")"
            if [ "$CONSOLE_HOSTING" = "ecs" ]; then
              echo "web=$(register "${NAME_PREFIX}-web" web "$web")"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Run database migrations (fails the deploy on a non-zero exit)
        if: steps.awake.outputs.awake == 'true'
        env:
          MIGRATE_TASK_DEFINITION: ${{ steps.taskdefs.outputs.migrate }}
        run: |
          set -euo pipefail
          # Reuse the network placement of the API service, so no subnet or security group ids are configured here.
          network=$(aws ecs describe-services --cluster "$NAME_PREFIX" --services "${NAME_PREFIX}-api" \
            --query 'services[0].networkConfiguration' --output json)
          task_arn=$(aws ecs run-task --cluster "$NAME_PREFIX" --launch-type FARGATE \
            --task-definition "$MIGRATE_TASK_DEFINITION" --network-configuration "$network" \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$task_arn" ] || [ "$task_arn" = "None" ]; then
            echo "::error::run-task did not start the migration task"
            exit 1
          fi
          echo "Migration task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$NAME_PREFIX" --tasks "$task_arn"

          task_id=${task_arn##*/}
          echo "::group::migration output"
          aws logs get-log-events --log-group-name "/ecs/${NAME_PREFIX}/migrate" \
            --log-stream-name "migrate/migrate/${task_id}" --limit 200 \
            --query 'events[].message' --output text || echo "(no log stream found)"
          echo "::endgroup::"

          exit_code=$(aws ecs describe-tasks --cluster "$NAME_PREFIX" --tasks "$task_arn" \
            --query "tasks[0].containers[?name=='migrate'].exitCode | [0]" --output text)
          if [ "$exit_code" != "0" ]; then
            reason=$(aws ecs describe-tasks --cluster "$NAME_PREFIX" --tasks "$task_arn" \
              --query 'tasks[0].stoppedReason' --output text)
            echo "::error::Migration failed (exit code: ${exit_code}; ${reason}). Services were not touched."
            exit 1
          fi

      - name: Update services and wait for them to settle
        if: steps.awake.outputs.awake == 'true'
        env:
          API_TASK_DEFINITION: ${{ steps.taskdefs.outputs.api }}
          WORKER_TASK_DEFINITION: ${{ steps.taskdefs.outputs.worker }}
          WEB_TASK_DEFINITION: ${{ steps.taskdefs.outputs.web }}
        run: |
          set -euo pipefail
          roles=(api worker)
          if [ "$CONSOLE_HOSTING" = "ecs" ]; then roles+=(web); fi
          for role in "${roles[@]}"; do
            var="${role^^}_TASK_DEFINITION"
            aws ecs update-service --cluster "$NAME_PREFIX" --service "${NAME_PREFIX}-${role}" \
              --task-definition "${!var}" --query 'service.serviceName' --output text
          done

          services=()
          for role in "${roles[@]}"; do services+=("${NAME_PREFIX}-${role}"); done
          aws ecs wait services-stable --cluster "$NAME_PREFIX" --services "${services[@]}"

          # The ECS circuit breaker rolls a failing deployment back automatically, and a rolled-back
          # service also becomes "stable". So check that each service really runs the new revision.
          failed=0
          for role in "${roles[@]}"; do
            var="${role^^}_TASK_DEFINITION"
            running=$(aws ecs describe-services --cluster "$NAME_PREFIX" --services "${NAME_PREFIX}-${role}" \
              --query 'services[0].taskDefinition' --output text)
            if [ "$running" != "${!var}" ]; then
              echo "::error::${role} is running ${running}, not ${!var}: the deployment failed and ECS rolled it back"
              failed=1
            fi
          done
          exit "$failed"

      # console_hosting = s3_cloudfront: build the single-page app and publish it. Hashed files under
      # assets/ never change, so they are cached for a year and never deleted (a browser holding the
      # previous index.html still finds its files); index.html is uploaded last and must not be cached.
      - name: Set up pnpm
        if: steps.awake.outputs.awake == 'true' && env.CONSOLE_HOSTING == 's3_cloudfront'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Set up Node
        if: steps.awake.outputs.awake == 'true' && env.CONSOLE_HOSTING == 's3_cloudfront'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build the console
        if: steps.awake.outputs.awake == 'true' && env.CONSOLE_HOSTING == 's3_cloudfront'
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish the console to S3 and invalidate CloudFront
        if: steps.awake.outputs.awake == 'true' && env.CONSOLE_HOSTING == 's3_cloudfront'
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "::error::Set the repository variable CLOUDFRONT_DISTRIBUTION_ID (terraform output cloudfront_distribution_id)."
            exit 1
          fi
          account=$(aws sts get-caller-identity --query Account --output text)
          bucket="${NAME_PREFIX}-console-${account}"
          aws s3 sync web/dist/assets "s3://${bucket}/assets" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync web/dist "s3://${bucket}" --exclude "assets/*" --exclude index.html --delete \
            --cache-control "public, max-age=3600"
          aws s3 cp web/dist/index.html "s3://${bucket}/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query Invalidation.Id --output text

      - name: Smoke test through the load balancer
        if: steps.awake.outputs.awake == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
          IMAGE_TAG: ${{ steps.arch.outputs.tag }}
        run: |
          set -euo pipefail
          dns=$(aws elbv2 describe-load-balancers --names "${NAME_PREFIX}-alb" \
            --query 'LoadBalancers[0].DNSName' --output text)
          if [ "$CONSOLE_HOSTING" = "s3_cloudfront" ]; then
            # /readyz is not routed through CloudFront (it would fall through to the console), so
            # probe the load balancer directly, then check both CloudFront paths when its URL is known.
            echo "Smoke testing http://${dns}"
            curl --fail --silent --show-error --location --retry 10 --retry-delay 6 --retry-all-errors \
              --max-time 10 "http://${dns}/readyz"
            echo
            if [ -n "$APP_URL" ]; then
              curl --fail --silent --show-error --location --retry 10 --retry-delay 6 --retry-all-errors \
                --max-time 10 --output /dev/null "${APP_URL}/"
              curl --fail --silent --show-error --location --retry 10 --retry-delay 6 --retry-all-errors \
                --max-time 10 --output /dev/null "${APP_URL}/openapi.json"
            else
              echo "::notice::Set the repository variable APP_URL to the CloudFront URL (terraform output app_url) to smoke test the console and the API through it."
            fi
          else
            if [ -z "$APP_URL" ]; then
              APP_URL="http://${dns}"
            fi
            echo "Smoke testing ${APP_URL}"
            curl --fail --silent --show-error --location --retry 10 --retry-delay 6 --retry-all-errors \
              --max-time 10 "${APP_URL}/readyz"
            echo
            curl --fail --silent --show-error --location --max-time 10 --output /dev/null "${APP_URL}/"
          fi
          echo "Deployed ${IMAGE_TAG}"
