[project]
name = "forgeeval-sdk"
version = "0.1.0"
description = "Python client SDK for ForgeEval: capture LLM traces, redact PII locally, upload in batches"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
]

[project.scripts]
forgeeval = "forgeeval_sdk.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forgeeval_sdk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: talks to a live ForgeEval stack; needs FORGEEVAL_IT_API_KEY",
]
